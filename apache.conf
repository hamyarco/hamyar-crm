ServerName crm.hamyar.co
<Directory /var/www/html>
    AllowOverride All
    Require all granted
</Directory>
# behind nginx + Cloudflare: trust the forwarded scheme so vtiger builds https links
SetEnvIf X-Forwarded-Proto "https" HTTPS=on
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy 127.0.0.1/8 172.16.0.0/12
